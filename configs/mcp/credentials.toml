schema_version = 1

[defaults]
timeout_seconds = 30

[vaults.default]
cli_command = ["keepassxc-cli"]

[vaults.default.database]
windows = ""
linux = "/opt/Shikigami-Lavelinha/configs/mcp/vaults/default.kdbx"

[profiles.default]
vault = "default"
allowed_entry_roots = []

[profiles.default.auth.windows]
mode = "windows_credential_manager"
target = "Lavelinha/MCP/KeePass/default"

[profiles.default.auth.linux]
mode = "command"
command = ["secret-tool", "lookup", "service", "shikigami-mcp", "shikigami", "Lavelinha", "profile", "default"]
