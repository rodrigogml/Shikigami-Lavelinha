schema_version = 2
enabled = false

[telegram]
vault_profile = "default"
token_entry = "Lavelinha/Serviço/Telegram:BotToken"
poll_timeout_seconds = 30
agent_outbound_media = true
default_share_thoughts = true
default_delete_thoughts = true

[agent]
max_parallel_conversations = 5
turn_timeout_seconds = 900
owner_execution_preferences = true
owner_allowed_models = []
owner_allowed_reasoning_efforts = []
busy_input_policy = "queue"
interrupt_grace_seconds = 15
post_turn_results = true

[limits]
max_attachment_bytes = 20971520
max_batch_attachment_bytes = 52428800
max_pending_items = 50
max_retained_attachment_bytes = 262144000
max_outbound_media_bytes = 20971520
max_outbound_media_per_turn = 3
context_max_messages = 100
context_max_age_seconds = 604800
preparation_workers = 4

[voice_reply]
enabled = false
eccovox_profile = ""
language = "pt-BR"
voice = ""
speed = 1.0
response_format = "mp3"
max_text_characters = 3500
auto_off_minutes = 15
fallback_to_text = true

[totp]
enabled = false
real_password_entry = ""
fake_password_entry = ""
period_seconds = 30
